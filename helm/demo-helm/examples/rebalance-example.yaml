# Pod 分布均匀性检测与重新平衡 - 基础配置示例
# 
# 适用场景：每30分钟自动检测Pod分布是否均匀，不均匀时触发重新平衡
# 
# 使用方法：
# helm install my-demo . -f examples/rebalance-example.yaml
# 或 
# helm upgrade my-demo . -f examples/rebalance-example.yaml

# 必须启用 ServiceAccount
serviceAccount:
  create: true

# Pod 分布均匀性检测配置
rebalance:
  # 启用重新平衡功能
  enabled: true
  
  # === 基础配置 ===
  
  # 每30分钟检测一次
  schedule: "*/30 * * * *"
  
  # 重新平衡策略
  strategy: "balanced"  # balanced(1/3), conservative(1/4), aggressive(1/2)
  
  # === 检测参数 ===
  
  # 不均匀度阈值 (0.3 = 30%)
  imbalanceThreshold: 0.3
  
  # 最小 Pod 数量阈值
  minPodsPerComponent: 2
  
  # === 调度配置 ===
  # CronJob 本身需要避免受到故障影响，调度到健康的 AZ
  
  nodeSelector:
    topology.kubernetes.io/zone: cn-guangzhou-b  # 健康的 AZ
  
  # 高可用调度配置
  affinity:
    nodeAffinity:
      # 强制要求：运行在健康 AZ
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: topology.kubernetes.io/zone
            operator: In
            values:
            - cn-guangzhou-b  # 主要健康 AZ
            - cn-guangzhou-c  # 备用健康 AZ
  
  # === 等待时间配置 ===
  
  # Pod 删除后等待时间
  waitTime: 30
  
  # 组件间处理等待时间  
  componentWaitTime: 10
  
  # === 资源配置 ===
  
  resources:
    limits:
      cpu: "200m"
      memory: "256Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
      
  # Job历史保留
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

# === 常见问题解答 ===

# Q1: CronJob 应该放在另外一个 AZ 上？
# A1: 是的，已配置 nodeSelector 和 affinity，确保 CronJob 运行在健康的 AZ（避免受到混沌工程影响）

# Q2: 默认副本数应该是几？
# A2: CronJob 本身是单实例（副本数为1），无需多副本。高可用通过调度策略保证

# Q3: 删除的 Pod 是 A AZ 还是 B AZ 还是不区分？
# A3: 不区分 AZ，完全随机删除。删除后 Kubernetes 会根据 topologySpreadConstraints 重新调度到合适位置

