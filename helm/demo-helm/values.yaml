rebalance:
  # 是否启用重新平衡 CronJob
  enabled: false
  
  # Cron 表达式：每30分钟检测一次
  schedule: "*/30 * * * *"
  
  # 重新平衡策略
  # - "balanced": 平衡策略，删除 1/3 的 Pod (默认)
  # - "conservative": 保守策略，删除 1/4 的 Pod
  # - "aggressive": 激进策略，删除 1/2 的 Pod
  strategy: "balanced"
  
  # 分布均匀性检测配置
  # 不均匀度阈值 (0.0-1.0)
  # 使用标准差/平均值计算，超过此值认为分布不均匀
  imbalanceThreshold: 0.3  # 30% 的不均匀度
  
  # 最小 Pod 数量阈值
  # 低于此数量的组件跳过检测 (避免误判)
  minPodsPerComponent: 2
  
  # Job 历史记录保留数量
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  backoffLimit: 2
  
  # 容器镜像配置
  image:
    repository: registry.cn-hangzhou.aliyuncs.com/google_containers/kubectl  # 阿里云镜像，网络更稳定
    tag: "v1.31.0"
    pullPolicy: IfNotPresent
    # 备选镜像（根据网络环境选择）：
    # repository: bitnami/kubectl  # Bitnami 镜像（注意拉取限制）
    # repository: registry.k8s.io/kubectl  # 官方镜像
  
  # 镜像拉取密钥（如果需要）
  imagePullSecrets: []
  
  # 环境变量
  env: []
  
  # 等待时间配置（秒）
  waitTime: 30              # Pod 删除后等待时间
  componentWaitTime: 10     # 组件间等待时间
  
  # Pod 注解
  podAnnotations: {}
  
  # 调度规则 - 确保 CronJob 在健康 AZ 运行（避免受混沌工程影响）
  nodeSelector:
    topology.kubernetes.io/zone: cn-guangzhou-b  # 指定健康的 AZ
  
  # 容忍度配置
  tolerations: []
    # 如果需要在控制平面节点运行，取消注释：
    # - key: "node-role.kubernetes.io/control-plane"
    #   operator: "Exists"
    #   effect: "NoSchedule"
    # 如果需要在有其他污点的节点运行，添加对应配置：
    # - key: "your-custom-taint"
    #   operator: "Equal"
    #   value: "value"
    #   effect: "NoSchedule"
  
  # Pod 级别安全上下文
  securityContext: {}
    # 推荐的安全配置（按需启用）：
    # runAsNonRoot: true
    # runAsUser: 1000
    # runAsGroup: 1000
    # fsGroup: 1000
    # seccompProfile:
    #   type: RuntimeDefault
  
  # 容器级别安全上下文  
  containerSecurityContext: {}
    # 基本安全配置（按需启用）：
    # allowPrivilegeEscalation: false
    # readOnlyRootFilesystem: false  # kubectl 需要写临时文件
    # runAsNonRoot: true
    # runAsUser: 1000
    # capabilities:
    #   drop:
    #     - ALL
  
  # 资源限制
  resources:
    limits:
      cpu: "200m"
      memory: "256Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"

  # CronJob 注解
  annotations:
    description: "自动检测Pod分布均匀性并重新平衡"

