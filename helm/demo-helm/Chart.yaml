apiVersion: v2
appVersion: latest
dependencies:
- condition: chaosblade-operator.enabled
  name: chaosblade-operator
  repository: file://../chaosblade-operator
  version: 1.7.4
- condition: opentelemetry-collector.enabled
  name: opentelemetry-collector
  repository: file://../opentelemetry-collector
  version: 0.118.0
