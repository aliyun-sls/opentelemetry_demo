spring:
  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000      # 连接超时5秒
        response-timeout: 15s      # HTTP响应总超时30秒 (兜底保护)
        pool:
          max-idle-time: ${MAX_IDLE_TIME:5s}
      routes:
        - id: health
          uri: no://op
          predicates:
            - Path=/health
          filters:
            - name: HealthCheck
        - id: check
          uri: no://op
          predicates:
            - Path=/api/checkout**
          filters:
            - name: CheckFilter
              args:
                checkoutAddr: ${CHECKOUT_ADDR:localhost:50051}
                productAddr: ${PRODUCT_ADDR:localhost:50052}
        - id: getProduct
          uri: no://op
          predicates:
            - Path=/api/products/{productId}
          filters:
            - name: GetProduct
              args:
                productAddr: ${PRODUCT_ADDR:localhost:50051}
                currencyAddr: ${CURRENCY_ADDR:localhost:50052}
        - id: listProduct
          uri: no://op
          predicates:
            - Path=/api/products
          filters:
            - name: ListProduct
              args:
                productAddr: ${PRODUCT_ADDR:localhost:50051}
                currencyAddr: ${CURRENCY_ADDR:localhost:50052}
        - id: cart
          uri: no://op
          predicates:
            - Path=/api/cart
          filters:
            - name: Cart
              args:
                cartAddr: ${CART_ADDR}
                productAddr: ${PRODUCT_ADDR}
                currencyAddr: ${CURRENCY_ADDR}
        - id: data
          uri: no://op
          predicates:
            - Path=/api/data
          filters:
            - name: Data
              args:
                dataAddr: ${AD_ADDR}
        - id: recommendation
          uri: no://op
          predicates:
            - Path=/api/recommendations
          filters:
            - name: Recommendation
              args:
                recommendationAddr: ${RECOMMENDATION_ADDR}
                productAddr: ${PRODUCT_ADDR}
                currencyAddr: ${CURRENCY_ADDR}
        - id: currency
          uri: no://op
          predicates:
            - Path=/api/currency
          filters:
            - name: Currency
              args:
                currencyAddr: ${CURRENCY_ADDR}
        - id: ads
          uri: http://ads:8080
          predicates:
            - Path=/ads/**
        - id: feature
          uri: http://flagd-ui:8013
          predicates:
            - Path=/feature**
        - id: grafana
          uri: http://grafana:3000
          predicates:
            - Path=/grafana**
        - id: images
          uri: http://image-provider:8081
          predicates:
            - Path=/images/**
        - id: marketing
          uri: http://marketing:8080
          predicates:
            - Path=/marketing/**
        - id: notification
          uri: http://notification:8080
          predicates:
            - Path=/notification/**
        - id: default
          uri: http://frontend:8080
          predicates:
            - Path=/**
          filters:
            - name: NoopFilter
server:
  port: 8085