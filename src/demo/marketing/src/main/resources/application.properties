# application.properties
server.port=8080

# 应用名称
spring.application.name=marketing

# 数据源配置
spring.datasource.url=jdbc:mysql://${MYSQL_ENDPOINT}/demo?useUnicode=true&characterEncoding=utf8mb4&useSSL=false
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL5InnoDBDialect

# JPA 配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect

# 设置全局日志级别
logging.level.root=INFO

# 设置特定包的日志级别（如 Spring MVC 和 Hibernate）
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=DEBUG
# 慢查询日志开关
spring.datasource.hikari.data-source-properties.slow-query-log=1
# 慢查询时间阈值（单位：毫秒）
spring.datasource.hikari.data-source-properties.long-query-time=2