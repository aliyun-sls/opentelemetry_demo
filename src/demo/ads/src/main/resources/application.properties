# application.properties
server.port=8080

# 应用名称
spring.application.name=ad

# 数据源配置
spring.datasource.url=jdbc:mysql://${MYSQL_ENDPOINT}/demo?useUnicode=true&characterEncoding=utf8mb4&useSSL=false
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL5InnoDBDialect

# JPA 配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect

# 设置全局日志级别
logging.level.root=INFO

# 设置特定包的日志级别（如 Spring MVC 和 Hibernate）
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# 设置Hibernate日志级别为DEBUG或TRACE
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=DEBUG

# 配置慢查询日志
spring.jpa.properties.hibernate.jdbc.log_slow_query=true
spring.jpa.properties.hibernate.jdbc.log_slow_query_threshold=3000

ads-scenarios.scenarios[0].name=normal
ads-scenarios.scenarios[0].weight=0.9
ads-scenarios.scenarios[1].name=delay
ads-scenarios.scenarios[1].weight=0.01
ads-scenarios.scenarios[2].name=table_not_exist
ads-scenarios.scenarios[2].weight=0.03
ads-scenarios.scenarios[3].name=sql_complex
ads-scenarios.scenarios[3].weight=0.03
ads-scenarios.scenarios[4].name=mass_insert
ads-scenarios.scenarios[4].weight=0.03