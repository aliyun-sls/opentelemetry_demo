# application.properties
server.port=8080

# 应用名称
spring.application.name=ad

# 数据源配置
spring.datasource.url=jdbc:mysql://${MYSQL_ENDPOINT}/demo
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect

# 设置全局日志级别
logging.level.root=INFO

# 设置特定包的日志级别（如 Spring MVC 和 Hibernate）
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=DEBUG
# 慢查询日志开关
spring.datasource.hikari.data-source-properties.slow-query-log=1
# 慢查询时间阈值（单位：毫秒）
spring.datasource.hikari.data-source-properties.long-query-time=2

ads-scenarios.scenarios[0].name=normal
ads-scenarios.scenarios[0].weight=0.60
ads-scenarios.scenarios[1].name=delay
ads-scenarios.scenarios[1].weight=0.10
ads-scenarios.scenarios[2].name=table_not_exist
ads-scenarios.scenarios[2].weight=0.10
ads-scenarios.scenarios[3].name=sql_delay
ads-scenarios.scenarios[3].weight=0.10
ads-scenarios.scenarios[4].name=sql_complex
ads-scenarios.scenarios[4].weight=0.05
ads-scenarios.scenarios[5].name=mass_insert
ads-scenarios.scenarios[5].weight=0.05