apiVersion: chaosblade.io/v1alpha1
kind: ChaosBlade
metadata:
  name: {{ .Name }}
spec:
  experiments:
    - scope: node
      target: network
      action: loss
      desc: "node network loss"
      matchers:
        - name: labels
          value: ["{{ .Labels }}"]
        - name: percent
          value:
            - "{{ .Percent }}"
        - name: interface
          value: ["eth0"]