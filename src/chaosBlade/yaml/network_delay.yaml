apiVersion: chaosblade.io/v1alpha1
kind: ChaosBlade
metadata:
  name: {{ .Name }}
spec:
  experiments:
    - scope: {{ .Scope }}
      target: network
      action: delay
      desc: "delay network by labels"
      matchers:
        - name: labels
          value: ["{{ .Labels }}"]
        - name: local-port
          value: ["{{ .Port }}"]
        - name: interface
          value: ["eth0"]
        - name: time
          value: ["{{ .Time }}"]
        - name: offset
          value: ["{{ .Offset }}"]