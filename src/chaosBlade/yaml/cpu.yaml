apiVersion: chaosblade.io/v1alpha1
kind: ChaosBlade
metadata:
  name: {{ .Name }}
spec:
  experiments:
    - scope: {{ .Scope }}
      target: cpu
      action: fullload
      desc: "increase cpu load by labels"
      matchers:
        - name: labels
          value: ["{{ .Labels }}"]
        - name: cpu-percent
          value: ["{{ .Percent }}"]
        - name: timeout
          value: ["{{ .Timeout }}"]