apiVersion: chaosblade.io/v1alpha1
kind: ChaosBlade
metadata:
  name: node-mem
spec:
  experiments:
    - scope: node
      target: mem
      action: load
      desc: "increase node cpu load by labels"
      matchers:
        - name: labels
          value: [ "{{ .Labels }}" ]
        - name: mem-percent
          value: [ "{{ .Percent }}" ]