apiVersion: chaosblade.io/v1alpha1
kind: ChaosBlade
metadata:
  name: node-mem
spec:
  experiments:
    - scope: node
      target: mem
      action: load
      desc: "increase node cpu load by names"
      matchers:
        - name: names
          value: {{ .Name }}
        - name: mode
          value:
            - "ram"
        - name: mem-percent
          value:
            - {{ .Percent }}
        - name: timeout
          value:
            - "600"