apiVersion: chaosblade.io/v1alpha1
kind: ChaosBlade
metadata:
  name: {{ .CRDName}}
spec:
  experiments:
    - scope: container
      target: cpu
      action: fullload
      desc: "increase container cpu load by id"
      matchers:
        - name: container-ids
          value:
            - {{ .ContainerID }}
        - name: cpu-percent
          value:
            - {{ .Percent }}
          # pod names
        - name: names
          value:
            - {{ .PodNames }}