apiVersion: chaosblade.io/v1alpha1
kind: ChaosBlade
metadata:
  name: {{ .Name }}
spec:
  experiments:
    - scope: {{ .Scope }}
      target: disk
      action: fill
      desc: "increase disk load by labels"
      matchers:
        - name: labels
          value: ["{{ .Labels }}"]
        - name: percent
          value: ["{{ .Percent }}"]
        - name: timeout
          value: [ "{{ .Timeout }}" ]