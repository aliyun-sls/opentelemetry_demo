apiVersion: chaosblade.io/v1alpha1
kind: ChaosBlade
metadata:
  name: node-disk
spec:
  experiments:
    - scope: node
      target: disk
      action: fill
      desc: "increase node disk load by labels"
      matchers:
        - name: labels
          value: ["{{ .Labels }}"]
        - name: percent
          value: ["{{ .Percent }}"]