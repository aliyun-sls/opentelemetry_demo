piVersion: chaosblade.io/v1alpha1
kind: ChaosBlade
metadata:
  name: cpu-load
spec:
  experiments:
    - scope: pod
      target: cpu
      action: fullload
      desc: "increase pod cpu load by labels"
      matchers:
        - name: labels
          value: ["{{ .Labels }}"]
        - name: cpu-percent
          value: ["{{ .Percent }}"]