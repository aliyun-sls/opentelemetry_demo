apiVersion: chaosblade.io/v1alpha1
kind: ChaosBlade
metadata:
  name: node-cpu
spec:
  experiments:
    - scope: node
      target: cpu
      action: fullload
      desc: "increase node cpu load by labels"
      matchers:
        - name: labels
          value: [ "{{ .Labels }}" ]
        - name: cpu-percent
          value: [ "{{ .Percent }}" ]