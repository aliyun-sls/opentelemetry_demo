apiVersion: chaosblade.io/v1alpha1
kind: ChaosBlade
metadata:
  name: node-cpu
spec:
  experiments:
    - scope: node
      target: cpu
      action: fullload
      desc: "increase node cpu load by names"
      matchers:
        - name: names
          value: {{ .Name }}
        - name: cpu-percent
          value:
            - {{ .Percent }}
        - name: timeout
          value:
            - "600"